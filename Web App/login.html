<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic page settings and linked assets -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - StreetBites</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>

<!-- Site header with logo and navigation links -->
<header>
  <div class="header-content">
    <div class="logo"><img src="images/logo2.jpg" alt="StreetBites Logo"><span class="logo-text">StreetBites</span></div>
    <!-- Button used by app.js to open and close the mobile menu -->
    <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false">Menu</button>
    <nav>
      <a href="index.html">Home</a>
      <a href="dashboard.html">Menu</a>
      <a href="history.html">History</a>
      <a href="auth.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="cart.html">Cart (<span data-cart-count>0</span>)</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
    </nav>
  </div>
</header>

<!-- Login form section -->
<div class="form-section">
  <h2>Sign In to Your Account</h2>
  <p style="text-align: center; color: var(--text-light); margin-bottom: 30px;">Welcome back! Please log in to your account</p>
  
  <!-- novalidate lets custom JavaScript validation handle form errors -->
  <form id="loginForm" novalidate>
    <!-- User email input -->
    <div class="form-group">
      <label for="loginEmail">Email Address</label>
      <input type="email" id="loginEmail" name="email" placeholder="your@email.com">
    </div>
    
    <!-- User password input -->
    <div class="form-group">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" name="password" placeholder="Enter your password">
    </div>
    
    <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
      <input type="checkbox" id="remember" style="width: auto;">
      <label for="remember" style="margin: 0;">Remember me</label>
    </div>
    <!-- Hidden message area for success or error feedback -->
    <div class="message" id="loginMessage" hidden></div>
    <button type="submit">Sign In</button>
  </form>
  
  <!-- Account help links -->
  <p style="text-align: center; color: var(--text-light); margin-top: 20px;">
    Don't have an account? <a href="register.html" style="color: var(--accent); text-decoration: none; font-weight: 600;">Create one here</a>
  </p>
  
  <p style="text-align: center; color: var(--text-light); margin-top: 10px;">
    <a href="#" style="color: var(--accent); text-decoration: none; font-weight: 600;">Forgot your password?</a>
  </p>
</div>

<!-- Site footer -->
<footer>
  <p>&copy; 2026 StreetBites. All rights reserved.</p>
</footer>

</body>
</html>
