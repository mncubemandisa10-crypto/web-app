<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic page settings and linked assets -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - StreetBites</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>

<!-- Site header with logo and navigation links -->
<header>
  <div class="header-content">
    <div class="logo"><img src="images/logo2.jpg" alt="StreetBites Logo"><span class="logo-text">StreetBites</span></div>
    <!-- Button used by app.js to open and close the mobile menu -->
    <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false">Menu</button>
    <nav>
      <a href="index.html">Home</a>
      <a href="dashboard.html">Menu</a>
      <a href="history.html">History</a>
      <a href="auth.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="cart.html">Cart (<span data-cart-count>0</span>)</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
    </nav>
  </div>
</header>

<!-- Account registration form section -->
<div class="form-section">
  <h2>Create Your Account</h2>
  <p style="text-align: center; color: var(--text-light); margin-bottom: 30px;">Join StreetBites and start ordering delicious food today</p>
  
  <!-- novalidate lets custom JavaScript validation handle form errors -->
  <form id="registerForm" novalidate>
    <!-- User personal details -->
    <div class="form-group">
      <label for="registerName">Full Name</label>
      <input type="text" id="registerName" name="fullName" placeholder="John Doe">
    </div>
    
    <div class="form-group">
      <label for="registerEmail">Email Address</label>
      <input type="email" id="registerEmail" name="email" placeholder="your@email.com">
    </div>
    
    <div class="form-group">
      <label for="registerPhone">Phone Number</label>
      <input type="tel" id="registerPhone" name="phone" placeholder="+27 72 123 4567">
    </div>
    
    <div class="form-group">
      <label for="registerAddress">Address</label>
      <input type="text" id="registerAddress" name="address" placeholder="Your delivery address">
    </div>
    
    <!-- Password fields used to confirm both values match -->
    <div class="form-group">
      <label for="registerPassword">Password</label>
      <input type="password" id="registerPassword" name="password" placeholder="Create a strong password">
    </div>
    
    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password">
    </div>
    
    <div class="form-group" style="display: flex; align-items: flex-start; gap: 10px;">
      <input type="checkbox" id="agree" name="agree" style="width: auto; margin-top: 5px;">
      <label for="agree" style="margin: 0;">I agree to the Terms of Service and Privacy Policy</label>
    </div>
    <!-- Hidden message area for success or error feedback -->
    <div class="message" id="registerMessage" hidden></div>
    <button type="submit">Create Account</button>
  </form>
  
  <!-- Link for users who already have an account -->
  <p style="text-align: center; color: var(--text-light); margin-top: 20px;">
    Already have an account? <a href="login.html" style="color: var(--accent); text-decoration: none; font-weight: 600;">Sign in here</a>
  </p>
</div>

<!-- Site footer -->
<footer>
  <p>&copy; 2026 StreetBites. All rights reserved.</p>
</footer>

</body>
</html>
